[project]
name = "garmin-grafana"
version = "0.3.0"
description = "A Python application to fetch Garmin health data and populate it in an InfluxDB Database, for visualizing long term health trends with Grafana"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "dotenv==0.9.9",
    "garmin-fit-sdk==21.214.0",
    "garminconnect==0.3.16",
    "influxdb==5.3.2",
    "influxdb3-python==0.12.0",
    "pandas==2.2.3",
]

[project.scripts]
garmin-fetch = "garmin_grafana:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/garmin_grafana"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Deliberately conservative (#12): pyflakes (F) catches real bugs --
# unused imports/variables, undefined names, f-strings with no
# placeholders. E9 is syntax errors. Ruff's much larger default/plugin
# rule set (datetime-timezone conventions, logging conventions, etc.)
# would flag hundreds of pre-existing, working, unrelated-to-this-ticket
# patterns across the codebase -- out of scope for "add lint tooling".
select = ["E9", "F"]
